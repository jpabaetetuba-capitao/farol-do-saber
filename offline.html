<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#087f5b">
  <title>Farol do Saber — Sem conexão</title>
  <style>
    *{box-sizing:border-box}
    body{
      margin:0; min-height:100vh; display:grid; place-items:center;
      padding:24px; font-family:Arial,Helvetica,sans-serif;
      background:linear-gradient(160deg,#062d52,#0a496f); color:white;
    }
    main{
      width:min(460px,100%); padding:28px; text-align:center;
      border-radius:24px; background:rgba(255,255,255,.12);
      border:1px solid rgba(255,255,255,.22);
    }
    .icone{font-size:64px}
    h1{margin:12px 0 8px}
    p{line-height:1.55;color:rgba(255,255,255,.9)}
    button{
      border:0;border-radius:14px;padding:13px 20px;font-weight:800;
      background:#20a46f;color:white;cursor:pointer;font-size:16px;
    }
  </style>
</head>
<body>
  <main>
    <div class="icone">🗼</div>
    <h1>Você está sem conexão</h1>
    <p>O Farol do Saber precisa de internet para carregar conteúdos atualizados, login e dados do Firebase.</p>
    <button onclick="location.reload()">Tentar novamente</button>
  </main>
</body>
</html>
